after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=0'
]

# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 300

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# ---------------------------------------------------------------------------
# Workspace layout (same on Studio Display, MBP only, and 2 external displays).
# Numbers are the work surface, letters are mnemonic.
#
#   1  Google Chrome
#   2  Rex
#   3  Zed
#   4  Claude
#   5  Codex
#   D  Docker
#   M  Mimestream (mail)
#   C  Comms: Slack / Teams / Discord
#   T  Tickets: Linear
#   N  Notes: Inkdrop
#   Y  YouTube (Chrome PWA)
#   U  Utility: 1Password / Zoom / Webex
#
# on-window-detected only fires for new windows.
# Run `~/dotfiles/aerospace/relayout.sh` (alt-shift-r) to re-apply the same
# mapping to already-open windows. Keep both files in sync.
# ---------------------------------------------------------------------------

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.superlogical.rex'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = ['move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = ['move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.mimestream.Mimestream'
run = ['move-node-to-workspace M']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace C']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace C']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace C']

[[on-window-detected]]
if.app-id = 'com.linear'
run = ['move-node-to-workspace T']

[[on-window-detected]]
if.app-id = 'info.pkpk.inkdrop'
run = ['move-node-to-workspace N']

# YouTube Chrome PWA (its app-id is not stable, match by name)
[[on-window-detected]]
if.app-name-regex-substring = '^YouTube$'
run = ['move-node-to-workspace Y']

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = ['move-node-to-workspace U']

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['move-node-to-workspace U']

[[on-window-detected]]
if.app-name-regex-substring = '(?i)webex'
run = ['move-node-to-workspace U']

# Float System Settings so it doesn't disrupt tiling layouts
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']


# Possible values: (qwerty|dvorak)
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
[gaps]
inner.horizontal = [{ monitor.main = 0 }, 0]
outer.left =       [{ monitor.main = 0 }, 0]
outer.right =      [{ monitor.main = 60 }, 20]
outer.bottom =     [{ monitor.main = 0 }, 0]
outer.top =        [{ monitor.main = 0 }, 0]


# 'main' binding mode declaration
[mode.main.binding]

alt-ctrl-shift-f = 'fullscreen --no-outer-gaps'
alt-ctrl-f = 'layout floating tiling'

alt-shift-left = 'join-with left'
alt-shift-down = 'join-with down'
alt-shift-up = 'join-with up'
alt-shift-right = 'join-with right'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspaces: numbers = work surface, letters = mnemonic (see layout above)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-d = 'workspace D'
alt-m = 'workspace M'
alt-c = 'workspace C'
alt-t = 'workspace T'
alt-n = 'workspace N'
alt-y = 'workspace Y'
alt-u = 'workspace U'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-d = 'move-node-to-workspace D --focus-follows-window'
alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
alt-shift-t = 'move-node-to-workspace T --focus-follows-window'
alt-shift-n = 'move-node-to-workspace N --focus-follows-window'
alt-shift-y = 'move-node-to-workspace Y --focus-follows-window'
alt-shift-u = 'move-node-to-workspace U --focus-follows-window'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Re-layout windows for the currently connected displays
alt-shift-r = 'exec-and-forget /Users/albertsema/dotfiles/aerospace/relayout.sh'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'
alt-shift-enter = 'mode apps'

# Multi-monitor navigation
alt-ctrl-h = 'focus-monitor left'
alt-ctrl-l = 'focus-monitor right'
alt-ctrl-shift-h = ['move-node-to-monitor left', 'focus-monitor left']
alt-ctrl-shift-l = ['move-node-to-monitor right', 'focus-monitor right']


# 'service' binding mode declaration.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

[mode.apps.binding]
# Launchers (alt-shift-enter, then a key). Window rules route each app to its workspace.
z = ['exec-and-forget open -a /Applications/Zed.app', 'mode main']
g = ['exec-and-forget open -a "/Applications/Rex Beta.app"', 'mode main']
c = ['exec-and-forget open -a /Applications/Claude.app', 'mode main']
x = ['exec-and-forget open -a /Applications/Codex.app', 'mode main']
i = ['exec-and-forget open -a /Applications/Inkdrop.app', 'mode main']
m = ['exec-and-forget open -a /Applications/Mimestream.app', 'mode main']
t = ['exec-and-forget open -a /Applications/Linear.app', 'mode main']
d = ['exec-and-forget open -a /Applications/Docker.app', 'mode main']
s = ['exec-and-forget open -a /Applications/Slack.app', 'mode main']
esc = 'mode main'

# ---------------------------------------------------------------------------
# Pin workspaces to monitors by role, not by display name.
#   main      -> macOS primary display (set in System Settings > Displays)
#   secondary -> any other display
# Work surface (1-5, D, Y) lives on main, mail/comms/tickets/notes/utility
# (M C T N U) prefer secondary. With a single display `secondary` does not
# exist and the list falls through to `main`, so every workspace still works.
# 2 Dells: make the left one primary.
# ---------------------------------------------------------------------------
[workspace-to-monitor-force-assignment]
1 = ['main']
2 = ['main']
3 = ['main']
4 = ['main']
5 = ['main']
D = ['main']
Y = ['main']
M = ['secondary', 'main']
C = ['secondary', 'main']
T = ['secondary', 'main']
N = ['secondary', 'main']
U = ['secondary', 'main']
