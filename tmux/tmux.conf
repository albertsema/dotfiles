source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=#ebbcba,bg=default'
set -g pane-border-style 'fg=#6e6a86,bg=default'
set -g message-style 'fg=#e0def4,bg=#26233a'
set -g mode-style 'fg=#191724,bg=#ebbcba'
set -g status-style 'fg=#e0def4,bg=default'
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=#31748f,bg=default]#[fg=#191724,bg=#31748f,bold] #S #[fg=#31748f,bg=default] "
set -g status-right "#[fg=#9ccfd8,bg=default]#[fg=#191724,bg=#9ccfd8,bold] #{b:pane_current_path} #[fg=#9ccfd8,bg=default] #[fg=#ebbcba,bg=default]#[fg=#191724,bg=#ebbcba,bold] %H:%M #[fg=#ebbcba,bg=default] "
set -g window-status-separator " "
setw -g window-status-format "#[fg=#26233a,bg=default]#[fg=#908caa,bg=#26233a] #I:#W#{?#{@wt_branch}, (#{@wt_branch}),}#{?#{@wt_git}, #{@wt_git},}#{?#{@agent_glyph}, #{@agent_glyph},} #[fg=#26233a,bg=default]"
setw -g window-status-current-format "#[fg=#ebbcba,bg=default]#[fg=#191724,bg=#ebbcba,bold] #I:#W#{?window_zoomed_flag,(),}#{?#{@wt_branch}, (#{@wt_branch}),}#{?#{@wt_git}, #{@wt_git},}#{?#{@agent_glyph}, #{@agent_glyph},} #[fg=#ebbcba,bg=default]"

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#ebbcba'
set -g @floax-text-color '#9ccfd8'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

run '~/.config/tmux/plugins/tpm/tpm'
# ─── drover: tmux-native AI-agent multiplexer ──────────────────────────────
# Add this to ~/.tmux.conf, then reload with: tmux source-file ~/.tmux.conf

# Let the daemon learn the focused pane/window (it also polls as a fallback).
set -g focus-events on

# Auto-start the daemon when a session is created (no-op if already running).
set-hook -g session-created 'run-shell -b "drover daemon >/dev/null 2>&1"'

# Optional: for lower-latency, more reliable state than screen-scraping, install
# agent hooks once with:  drover integration install claude

# Per-window drover badges (worktree branch/git, agent glyph) are folded into
# the themed window-status-format / window-status-current-format above, so they
# inherit your rosé-pine styling instead of being overridden here.

# Global rollup (●blocked ◐working ✓done) centered in the status bar, leaving
# your status-left/right intact (tmux has no real "center" slot, so we override
# status-format[0] and inject a centered #{@agents_summary}).
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=centre]#{@agents_summary}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# ─── drover key bindings (prefix + key) ────────────────────────────────────
# Pickers run in a popup; jumps act directly.
bind o display-popup -E -w 80% -h 70% 'drover projects'
bind w display-popup -E -w 80% -h 70% 'drover worktree'
bind a display-popup -E -w 80% -h 70% 'drover agents'
bind A run-shell 'drover jump --state blocked'
bind D run-shell 'drover jump --state done'
bind C-w command-prompt -p "new worktree branch:" 'run-shell "drover worktree new %%"'
# ───────────────────────────────────────────────────────────────────────────
